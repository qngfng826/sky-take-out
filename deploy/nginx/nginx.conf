# 容器版 nginx 配置：复刻课程版 conf/nginx.conf，
# 仅两处改动——上游从 localhost:8080 改为 compose 服务名 backend；root 改为容器内绝对路径
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       80;
    server_name  localhost;

    # 管理端前端静态资源（SPA 构建产物）
    location / {
        root   /usr/share/nginx/html/sky;
        index  index.html index.htm;
    }

    # 反向代理：管理端请求 /api/xxx -> 后端 /admin/xxx
    location /api/ {
        proxy_pass http://backend:8080/admin/;
    }

    # 反向代理：用户端请求 /user/xxx -> 后端 /user/xxx
    location /user/ {
        proxy_pass http://backend:8080/user/;
    }

    # WebSocket（来单提醒）
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "$connection_upgrade";
    }
}
