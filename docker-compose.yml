# 苍穹外卖本地容器化部署（Docker Compose）
# 详细用法与冒烟验证见 doc/部署说明.md
# 安全提示：以下密码仅用于本机容器环境（与本地开发环境隔离），切勿用于任何生产环境
name: sky-take-out

services:
  mysql:
    image: mysql:8.0
    container_name: sky-mysql
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: sky123456
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动（空数据卷）时自动执行建库建表脚本；重置数据库用 docker compose down -v
      - ./doc/sky.sql:/docker-entrypoint-initdb.d/sky.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psky123456"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:6.2-alpine
    container_name: sky-redis
    command: ["redis-server", "--requirepass", "sky123456", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a sky123456 ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  rabbitmq:
    build: ./deploy/rabbitmq
    container_name: sky-rabbitmq
    environment:
      TZ: Asia/Shanghai
      # 官方镜像的 guest 账号只允许 localhost 登录，跨容器必须自建用户
      RABBITMQ_DEFAULT_USER: sky
      RABBITMQ_DEFAULT_PASS: sky123456
    ports:
      - "15672:15672"   # 管理界面 http://localhost:15672（sky / sky123456）
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  backend:
    build: .
    container_name: sky-backend
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      # 容器版配置：host 写 compose 服务名，外置配置优先级高于 jar 内打包的 application-dev.yml
      - ./deploy/config/application-dev.yml:/app/config/application-dev.yml:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.20.2
    container_name: sky-nginx
    ports:
      - "80:80"   # 若宿主机 80 被占用，改为 "8000:80"，前端改访问 http://localhost:8000
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/html/sky:/usr/share/nginx/html/sky:ro
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
